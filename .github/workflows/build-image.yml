# 手动触发的镜像构建：构建镜像并推送到 GitHub Container Registry。
# 触发方式仅 workflow_dispatch，push 与 tag 不会自动构建。
# 仓库与 GHCR 包均为私有，VPS 拉取前需 docker login ghcr.io（PAT 需 read:packages）。
name: build-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 镜像名必须是全小写；GitHub 表达式无小写函数，用 bash 展开处理。
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
